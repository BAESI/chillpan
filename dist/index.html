<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chillpan is a quiet global chalkboard where each visitor gets one piece of chalk per day."
    />
    <title>Chillpan</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23111a17'/%3E%3Cpath d='M12 25 20 6' stroke='%23eeeadd' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="chalkboard" aria-label="Global chalkboard drawing surface"></canvas>

      <div class="board-controls">
        <div class="room-toggle" role="group" aria-label="칠판 이동">
          <button type="button" data-room="1" aria-pressed="true">1반</button>
          <button type="button" data-room="2" aria-pressed="false">2반</button>
          <button type="button" data-room="3" aria-pressed="false">3반</button>
        </div>
        <button class="new-chalk" id="newChalkButton" type="button">
          <span class="chalk-swatch" aria-hidden="true"></span>
          <span id="newChalkLabel">새 분필</span>
        </button>
      </div>

      <div class="chalk-tray" aria-hidden="true"></div>

      <div class="chalk-cursor" id="chalkCursor" aria-hidden="true">
        <span></span>
      </div>

      <div class="notice" id="notice" role="status" aria-live="polite">
        drag to spend today's chalk
      </div>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>

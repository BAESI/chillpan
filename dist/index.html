<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chillpan is a quiet global chalkboard where each visitor gets one piece of chalk per day."
    />
    <title>Chillpan</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23111a17'/%3E%3Cpath d='M12 25 20 6' stroke='%23eeeadd' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="chalkboard" aria-label="Global chalkboard drawing surface"></canvas>

      <section class="chalk-tray" aria-label="분필 받침대">
        <div class="tray-objects">
          <div class="eraser" aria-hidden="true">
            <span class="eraser-handle"></span>
            <span class="eraser-felt"></span>
          </div>
          <button class="new-chalk" id="newChalkButton" type="button" aria-label="새 분필">
            <span class="resting-chalk" aria-hidden="true"></span>
            <span class="spare-chalk" aria-hidden="true"></span>
            <span class="tool-tooltip" id="newChalkLabel">새 분필</span>
          </button>
          <div class="tray-dust" aria-hidden="true"></div>
        </div>
      </section>

      <div class="chalk-cursor" id="chalkCursor" aria-hidden="true">
        <span></span>
      </div>

      <div class="notice" id="notice" role="status" aria-live="polite">
        drag to spend today's chalk
      </div>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
